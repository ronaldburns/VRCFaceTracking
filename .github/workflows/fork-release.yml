name: Fork Release
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Releases are numbered by run, so don't let two pushes race each other
concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history and tags, for the changelog

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same as upstream's Steam build, which is also framework-dependent
      - name: Publish Windows (x64)
        run: |
          dotnet publish VRCFaceTracking/VRCFaceTracking.csproj --configuration Release -r win-x64 --self-contained false --output ./publish/windows
          dotnet publish VRCFaceTracking.ModuleProcess/VRCFaceTracking.ModuleProcess.csproj --configuration Release -r win-x64 --self-contained false --output ./publish/windows

      - name: Package
        run: cd publish/windows && zip -qr ../../VRCFaceTracking-win-x64.zip .

      - name: Write release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Directory.Build.props)
          echo "tag=v${version}-ron.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          {
            echo "Unofficial build of [VRCFaceTracking](https://github.com/benaclejames/VRCFaceTracking) from this fork's \`master\` branch at ${GITHUB_SHA::7}. It includes changes that aren't in the official release and isn't supported by the VRCFaceTracking team."
            echo
            echo "Needs the [.NET 10 runtime](https://dotnet.microsoft.com/download/dotnet/10.0). Extract the zip and run \`VRCFaceTracking.exe\` from the extracted folder."

            previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$previous" ]; then
              echo
              echo "### Changes since $previous"
              git log --no-merges --format='- %s (%h)' "$previous..HEAD"
            fi
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" VRCFaceTracking-win-x64.zip \
            --target "$GITHUB_SHA" \
            --title "${{ steps.notes.outputs.tag }}" \
            --notes-file release-notes.md
