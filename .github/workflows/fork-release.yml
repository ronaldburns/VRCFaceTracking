name: Fork Release
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Releases are numbered by run, so don't let two pushes race each other
concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  # Versions are <AssemblyVersion>-<suffix>.<run>. A fork can use its own suffix
  RELEASE_SUFFIX: ron

jobs:
  release:
    # vpk can only build Windows installers on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history and tags, for the changelog

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          base=$(sed -n 's|.*<AssemblyVersion>\([0-9]*\.[0-9]*\.[0-9]*\).*|\1|p' Directory.Build.props)
          version="${base}-${RELEASE_SUFFIX}.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Framework-dependent like upstream's Steam build. UpdateRepository is where installed copies look for updates
      - name: Publish Windows (x64)
        run: |
          for project in VRCFaceTracking/VRCFaceTracking.csproj VRCFaceTracking.ModuleProcess/VRCFaceTracking.ModuleProcess.csproj; do
            dotnet publish "$project" --configuration Release -r win-x64 --self-contained false \
              -p:UpdateRepository=${{ github.repository }} --output ./publish/windows
          done

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Unofficial build of [VRCFaceTracking](https://github.com/benaclejames/VRCFaceTracking) from this fork's \`master\` branch at ${GITHUB_SHA::7}. It includes changes that aren't in the official release and isn't supported by the VRCFaceTracking team."
            echo
            echo "Run \`VRCFaceTracking-win-Setup.exe\` to install it. It installs the .NET 10 runtime if needed, and after that VRCFaceTracking updates itself from this repo's releases. \`VRCFaceTracking-win-Portable.zip\` is the same app to extract anywhere, and it updates itself too. The files aren't signed, so Windows SmartScreen warns about them."

            previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$previous" ]; then
              echo
              echo "### Changes since $previous"
              git log --no-merges --format='- %s (%h)' "$previous..HEAD"
            fi
          } > release-notes.md

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # The previous release lets vpk build a delta package, so updates download less
      - name: Download previous release
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ github.token }}" \
            || echo "No previous Velopack release to build a delta from"

      - name: Package
        run: |
          vpk pack --packId VRCFaceTracking --packVersion "${{ steps.version.outputs.version }}" \
            --packDir ./publish/windows --mainExe VRCFaceTracking.exe --runtime win-x64 \
            --packTitle VRCFaceTracking --packAuthors "${{ github.repository_owner }}" \
            --framework net10-x64-runtime --icon VRCFaceTracking/Assets/WindowIcon.ico \
            --releaseNotes release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ github.token }}" \
            --publish --tag "${{ steps.version.outputs.tag }}" --releaseName "${{ steps.version.outputs.tag }}" \
            --targetCommitish "$GITHUB_SHA"
          gh release edit "${{ steps.version.outputs.tag }}" --notes-file release-notes.md
